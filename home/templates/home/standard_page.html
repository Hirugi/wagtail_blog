{% extends "base.html" %}
{% load static %}

{% block body_class %}standard_page{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap">
{% endblock extra_css %}

{% block content %}
<div class="blog-post-container">
    <h1 class="post-page-title">{{ page.title }}</h1>
    <div class="post-body">
        {% if page.body %}
            {% for block in page.body %}
                {{ block }}
            {% endfor %}
        {% endif %}
    </div>
</div>
{% endblock content %}
