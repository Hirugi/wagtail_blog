{% load wagtailimages_tags %}
<figure class="post-responsive-image">
  {% image self width-1200 as rendition %}
  {% image self width-2000 as big %}
  <img src="{{ rendition.url }}"
       data-fullsrc="{{ big.url }}"
       data-zoomable
       alt="{{ self.alt_text }}"
       class="post-responsive-image__img">
  
</figure>
